<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GeminIsland</title>
    <meta
      name="description"
      content="Add your contribution to the voxel world!"
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="https://geminisland.raph.plus/" />

    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Apple Messages / WhatsApp / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GeminIsland" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://geminisland.raph.plus/" />
    <meta property="og:title" content="GeminIsland" />
    <meta
      property="og:description"
      content="Add your contribution to the voxel world!"
    />
    <meta property="og:image" content="https://geminisland.raph.plus/og-vertical.jpg" />
    <meta property="og:image:secure_url" content="https://geminisland.raph.plus/og-vertical.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="768" />
    <meta property="og:image:height" content="1376" />
    <meta property="og:image:alt" content="Live 3D snapshot of GeminIsland voxel world" />

    <meta property="og:image" content="https://geminisland.raph.plus/og-square.jpg" />
    <meta property="og:image:secure_url" content="https://geminisland.raph.plus/og-square.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="GeminIsland shared 3D voxel world" />

    <meta property="og:image" content="https://geminisland.raph.plus/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://geminisland.raph.plus/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1376" />
    <meta property="og:image:height" content="768" />
    <meta property="og:image:alt" content="Panoramic live view of GeminIsland" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://geminisland.raph.plus/" />
    <meta name="twitter:title" content="GeminIsland" />
    <meta
      name="twitter:description"
      content="Add your contribution to the voxel world!"
    />
    <meta name="twitter:image" content="https://geminisland.raph.plus/og-image.jpg" />
    <meta name="twitter:image:alt" content="Live 3D snapshot of GeminIsland voxel world" />

    <!-- Apple Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GeminIsland" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Endless Animated Sunlit Grass Voxel Canvas -->
    <canvas id="world-canvas" aria-label="Shared animated 3D voxel grass world"></canvas>

    <!-- Camera Controls (Desktop + Mobile: Pan / Orbit / Walk + Recentre) -->
    <div id="cam-controls" class="cam-controls" role="toolbar" aria-label="Camera controls">
      <div class="cam-mode-group" role="group" aria-label="Camera mode">
        <button
          type="button"
          id="cam-pan-btn"
          class="cam-mode-btn is-active"
          aria-pressed="true"
          title="Move camera"
        >
          <svg class="cam-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3" />
          </svg>
          <span>Pan</span>
        </button>
        <button
          type="button"
          id="cam-orbit-btn"
          class="cam-mode-btn"
          aria-pressed="false"
          title="Spin and tilt camera"
        >
          <svg class="cam-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <polyline points="21 3 21 9 15 9" />
          </svg>
          <span>Orbit</span>
        </button>
        <button
          type="button"
          id="cam-walk-btn"
          class="cam-mode-btn"
          aria-pressed="false"
          title="Walk in first person"
        >
          <svg class="cam-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="4.5" r="2" />
            <path d="M8.5 20.5L10.8 14l3.2 2.8.6 3.7" />
            <path d="M10.8 14l1-5.2" />
            <path d="M7.5 12.4l3.8-3.4 3.4 1 2.3 2.2" />
          </svg>
          <span>Walk</span>
        </button>
      </div>

      <button
        type="button"
        id="recenter-btn"
        class="cam-recenter-btn"
        title="Recentre camera"
      >
        <svg class="cam-icon cam-compass-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" stroke-opacity="0.35" />
          <g id="recenter-compass">
            <polygon points="12,4.2 14.7,12 9.3,12" fill="#d94e43" />
            <polygon points="12,19.8 14.7,12 9.3,12" fill="currentColor" fill-opacity="0.55" />
          </g>
        </svg>
        <span>Recentre</span>
      </button>
    </div>

    <!-- Hover nameplate + optional live API readout -->
    <div id="hover-card" class="hover-card" hidden>
      <div id="hover-name" class="hover-name"></div>
      <div id="hover-feed" class="hover-feed" hidden></div>
      <div id="hover-status" class="hover-status"></div>
    </div>

    <!-- Transient world note -->
    <div id="weave-toast" class="weave-toast" role="status" aria-live="polite" hidden></div>

    <!-- Bottom-Anchored Explore & Build Dock (never blocks the 3D meadow) -->
    <div class="bottom-dock">
      <!-- 1. Explore-first single Add button -->
      <button type="button" id="add-btn" class="dock-pill dock-pill-add">
        + Add
      </button>

      <!-- 2. Spot-picking prompt pill -->
      <div id="pick-spot-pill" class="dock-pill dock-pill-pick" hidden>
        <span>Click where to add</span>
        <button type="button" id="cancel-pick-btn" class="icon-close-btn" aria-label="Cancel spot selection">
          &times;
        </button>
      </div>

      <!-- 3. Compact bottom building box -->
      <section id="bottom-builder" class="bottom-builder" aria-label="Add creation" hidden>
        <div class="builder-bar">
          <button type="button" id="move-spot-btn" class="spot-chip-btn">Move spot</button>
          <button type="button" id="close-builder-btn" class="icon-close-btn" aria-label="Close">
            &times;
          </button>
        </div>

        <div class="builder-row">
          <label id="drop-zone" class="drop-tile" for="image-input" title="Upload image">
            <input id="image-input" type="file" accept="image/*" hidden />
            <div id="drop-empty" class="drop-tile-empty">
              <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="3" />
                <circle cx="8.5" cy="9.5" r="1.5" />
                <path d="M21 15l-4.5-4.5L9 18" />
              </svg>
              <span>Photo</span>
            </div>
            <div id="drop-preview-wrap" class="drop-preview-wrap" hidden>
              <img id="drop-preview-img" alt="Selected subject" />
              <button type="button" id="clear-image-btn" class="clear-img-btn" aria-label="Remove image">
                &times;
              </button>
            </div>
          </label>

          <textarea
            id="prompt-input"
            rows="2"
            maxlength="480"
            placeholder="Describe what to add…"
            aria-label="Describe what to add"
          ></textarea>
        </div>

        <p id="form-error" class="form-error" role="alert" hidden></p>

        <button type="button" id="sculpt-btn" class="primary-btn">Build</button>
      </section>

      <!-- 4. Building in background pill -->
      <div id="building-pill" class="dock-pill dock-pill-building" role="status" aria-live="polite" hidden>
        <span class="pill-spinner" aria-hidden="true"></span>
        <span id="building-pill-label">Building…</span>
      </div>

      <!-- 5. Ready -> Click to fly camera to it -->
      <button type="button" id="ready-goto-btn" class="dock-pill dock-pill-ready" hidden>
        <span class="live-dot live-dot-pulse" aria-hidden="true"></span>
        <span id="ready-goto-label">Ready · Go to creation</span>
      </button>

      <!-- 6. Locate existing creation -->
      <button type="button" id="locate-mine-btn" class="dock-pill dock-pill-placed" hidden>
        <span class="live-dot" aria-hidden="true"></span>
        <span id="locate-mine-label">Locate yours</span>
      </button>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
